# reason agent: Hermes configuration template.
# Rendered at boot by cont-init.d/005-reason-seed: double-brace placeholders come from the environment.
# Secrets stay as ${NAME} and are expanded by Hermes at runtime, never written to disk.

model:
  default: "{{REASON_MODEL}}"
  provider: custom
  base_url: "{{REASON_MODEL_BASE_URL}}"
  api_key: ${REASON_MODEL_API_KEY}

agent:
  # Fast turns: the agent acts, it does not deliberate at length.
  reasoning_effort: none
  # Screenshots go straight to the (vision-capable) model, no extra vision call.
  image_input_mode: native
  # No "working… N min" or timeout notices in the chat.
  gateway_notify_interval: 0
  gateway_timeout_warning: 0
  # The agent works through its own computer (browser MCP, desktop, phone), not a shell.
  disabled_toolsets:
    - terminal
    - code_execution
    - file
    - delegation
    - cronjob
    - kanban
    - homeassistant
    - image_gen
    - video_gen
    - video
    - web
    - search
    - x_search
    - browser
    - tts
    - todo
    - project
    - bot_room
    - discord
    - discord_admin
    - vision
    - computer_use     # the agent's computer is the browser and phone MCPs below
    - connections      # connectors come later, with their own tags in reason_guard

# The reason guard (reason_guard/) asks the owner before anything that buys, sends, publishes
# or deletes. Those asks must reach a person: no auto-approval anywhere.
approvals:
  mode: manual
  timeout: 900
  cron_mode: deny
  unattended_mode: deny
  single_query_mode: deny

# Compaction is lossy (an LLM summary), so it runs rarely; pruning old tool output
# (screenshots, accessibility trees) is lossless for the conversation and runs early.
compression:
  enabled: true
  threshold_tokens: 100000
  proactive_prune_tokens: 20000
  min_tail_user_messages: 3
  protect_last_n: 8
  progress_notices: false

display:
  busy_input_mode: queue        # follow-ups are handled by reason_flow first (join the running turn)
  busy_ack_enabled: false
  tool_progress: "off"
  interim_assistant_messages: false
  long_running_notifications: false
  show_reasoning: false
  platforms:
    telegram:
      streaming: false
      tool_progress: "off"
    whatsapp:
      streaming: false
      tool_progress: "off"

streaming:
  enabled: false

# Voice notes are transcribed and handled as text. No text-to-speech.
stt:
  enabled: true
  provider: openai
  language: "{{REASON_LANGUAGE}}"
  openai:
    model: "{{REASON_STT_MODEL}}"
    base_url: "{{REASON_MODEL_BASE_URL}}"
    api_key: ${REASON_MODEL_API_KEY}

voice:
  auto_tts: false

mcp_servers:
  browser:
    url: "{{REASON_BROWSER_MCP_URL}}"
    tools:
      # Closed list, the same as reason_guard.policy.BROWSER_TOOLS (a test keeps them equal).
      # Left out: running JavaScript or code in the page, raw key events, file upload and drop,
      # network and console tools, page-provided (WebMCP) tools.
      include:
        - browser_click
        - browser_close
        - browser_drag
        - browser_fill_form
        - browser_find
        - browser_handle_dialog
        - browser_hover
        - browser_navigate
        - browser_navigate_back
        - browser_press_key
        - browser_resize
        - browser_select_option
        - browser_snapshot
        - browser_tabs
        - browser_take_screenshot
        - browser_type
        - browser_wait_for
  # >>> phone (removed at boot unless REASON_PHONE_MCP_URL is set: the phone is optional)
  phone:
    url: "{{REASON_PHONE_MCP_URL}}"
    headers:
      Authorization: "Bearer ${REASON_PHONE_MCP_TOKEN}"
    tools:
      # Closed list. Left out on purpose: installing/uninstalling apps, clearing app data,
      # batch commands (they would run any other tool), clipboard, device logs and crashes,
      # recordings, saving files, location spoofing, folding, and the mobilenext cloud.
      include:
        - mobile_list_available_devices
        - mobile_get_screen_size
        - mobile_get_orientation
        - mobile_set_orientation
        - mobile_list_apps
        - mobile_launch_app
        - mobile_terminate_app
        - mobile_get_foreground_app
        - mobile_open_url
        - mobile_list_elements_on_screen
        - mobile_take_screenshot
        - mobile_click_on_screen_at_coordinates
        - mobile_double_tap_on_screen
        - mobile_long_press_on_screen_at_coordinates
        - mobile_swipe_on_screen
        - mobile_drag_on_screen
        - mobile_type_keys
        - mobile_press_button
  # <<< phone

# >>> whatsapp (removed at boot unless WHATSAPP_ENABLED=true: on its own this block turns
#     the platform on in Hermes 0.23, even with WHATSAPP_ENABLED=false)
whatsapp:
  unauthorized_dm_behavior: ignore
  group_policy: disabled
  reply_prefix: ""
  send_read_receipts: false
  text_batch_delay_seconds: 1.5
# <<< whatsapp
