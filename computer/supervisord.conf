; reason computer: a virtual desktop the agent drives (Playwright MCP) and the owner can watch or take over (noVNC).
[supervisord]
nodaemon=true
user=reason
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=openbox
environment=DISPLAY=":1"
priority=20
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:vnc]
; VNC only on the container's loopback; the owner reaches it through noVNC below.
command=x11vnc -display :1 -localhost -forever -shared -rfbauth /tmp/vncpass -quiet
priority=30
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 127.0.0.1:5900
priority=40
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

[program:mcp]
; Playwright MCP launches a visible Chromium on :1 with a persistent profile (logins survive restarts).
; CDP never leaves the container: only the MCP endpoint (8931) is reachable, on the agent's internal network.
command=/usr/local/bin/reason-mcp
environment=DISPLAY=":1"
priority=50
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
